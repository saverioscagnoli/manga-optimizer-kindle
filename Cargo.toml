[package]
name = "efit"
version = "0.1.0"
edition = "2024"

[dependencies]
fast_image_resize = { version = "6.1.0", features = ["image"] }
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
image = { version = "0.25.10", features = ["webp", "png", "jpeg"], default-features = false }
lexopt = "0.3.2"
natord = "1.0.9"
png = "0.18.1"
rawzip = "0.5.2"
rayon = "1.12.0"
